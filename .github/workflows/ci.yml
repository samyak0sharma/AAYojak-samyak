name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aayojak
          POSTGRES_USER: aayojak
          POSTGRES_PASSWORD: aayojak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aayojak -d aayojak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://aayojak:aayojak@localhost:5432/aayojak?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @aayojak/api test
      - run: pnpm --filter @aayojak/web build
