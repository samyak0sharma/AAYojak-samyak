services:
  postgres:
    image: postgres:16-alpine
    container_name: aayojak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aayojak
      POSTGRES_USER: aayojak
      POSTGRES_PASSWORD: aayojak
    ports:
      - "5432:5432"
    volumes:
      - aayojak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aayojak -d aayojak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aayojak-postgres-data:

